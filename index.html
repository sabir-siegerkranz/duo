<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DuoCards - Supabase Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #00a8ff;
            --success: #2ed573;
            --warning: #ffa502;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --text: #2f3542;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .hidden { display: none !important; }

        .card-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select, button, input {
            font-size: 14px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
        }

        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { opacity: 0.9; }

        .nav-tabs { display: flex; gap: 10px; }
        .nav-tabs button { flex: 1; background-color: #e0e0e0; color: var(--text); }
        .nav-tabs button.active { background-color: var(--primary); color: white; }

        /* Flashcard Styles */
        .flashcard-container { perspective: 1000px; height: 220px; margin: 15px 0; }
        .flashcard {
            width: 100%; height: 100%; position: relative;
            transform-style: preserve-3d; transition: transform 0.6s; cursor: pointer;
        }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; display: flex; flex-direction: column;
            justify-content: center; align-items: center; border-radius: 12px;
            border: 2px solid #eee; background: white; padding: 20px; box-sizing: border-box; text-align: center;
        }
        .card-back { transform: rotateY(180deg); background-color: #f8f9fa; }
        .card-word { font-size: 24px; font-weight: bold; margin-bottom: 8px; }
        .card-example { font-size: 14px; color: #666; font-style: italic; }

        .controls { display: flex; gap: 10px; }
        .controls button { flex: 1; padding: 12px; }
        .btn-again { background-color: #ff4757; }
        .btn-good { background-color: var(--success); }

        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }

        /* Stats */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; text-align: center; }
        .stat-box { padding: 10px; border-radius: 8px; background: #f8f9fa; }
        .stat-box.to-learn { border-top: 4px solid var(--primary); }
        .stat-box.practiced { border-top: 4px solid var(--warning); }
        .stat-box.learned { border-top: 4px solid var(--success); }
        .stat-number { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <!-- LOGIN VIEW -->
    <div id="view-login" class="card-box">
        <h2>Sign In</h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="login-username" placeholder="Orkhan or Aziz">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password">
        </div>
        <button style="width: 100%; padding: 10px;" onclick="login()">Log In</button>
    </div>

    <!-- APP VIEW -->
    <div id="view-app" class="hidden" style="display: flex; flex-direction: column; gap: 15px;">
        <div class="card-box header">
            <div>
                <span id="user-display" style="font-weight: bold;"></span>
                <button style="background: none; color: #888; border: none; padding: 0 0 0 10px;" onclick="logout()">(logout)</button>
            </div>
            <div>
                <select id="deckSelector" onchange="switchDeck()"></select>
                <button onclick="createNewDeck()">+ Deck</button>
            </div>
        </div>

        <div class="nav-tabs">
            <button id="tab-practice" class="active" onclick="showTab('practice')">Practice</button>
            <button id="tab-add" onclick="showTab('add')">Add Word</button>
            <button id="tab-stats" onclick="showTab('stats')">Progress</button>
        </div>

        <!-- PRACTICE SECTION -->
        <div id="section-practice" class="card-box section">
            <div id="game-container">
                <div class="flashcard-container">
                    <div class="flashcard" id="card" onclick="flipCard()">
                        <div class="card-face card-front">
                            <div class="card-word" id="front-text">Loading...</div>
                            <div class="card-example" id="front-subtext">Click to flip</div>
                        </div>
                        <div class="card-face card-back">
                            <div class="card-word" id="back-text">...</div>
                            <div class="card-example" id="back-example">...</div>
                        </div>
                    </div>
                </div>

                <div class="controls">
                    <button class="btn-again" onclick="rateCard(false)">Forgot / Again</button>
                    <button class="btn-good" onclick="rateCard(true)">Got it!</button>
                </div>
            </div>
            <div id="empty-state" class="hidden" style="text-align: center; padding: 30px 0;">
                🎉 Deck is empty or completely practiced! Add more cards.
            </div>
        </div>

        <!-- ADD WORD SECTION -->
        <div id="section-add" class="card-box section hidden">
            <h3>Add New Card</h3>
            <div class="form-group">
                <label>German Word/Phrase:</label>
                <input type="text" id="input-de">
            </div>
            <div class="form-group">
                <label>English Translation:</label>
                <input type="text" id="input-en">
            </div>
            <button style="width: 100%; margin-bottom: 10px; background-color: #70a1ff;" onclick="autoTranslate()">⚡ Auto-Translate & Generate Example</button>
            <div class="form-group">
                <label>Example Sentence (German):</label>
                <input type="text" id="input-ex-de">
            </div>
            <div class="form-group">
                <label>Example Sentence (English):</label>
                <input type="text" id="input-ex-en">
            </div>
            <button style="width: 100%;" onclick="addCard()">Save Card</button>
        </div>

        <!-- STATS SECTION -->
        <div id="section-stats" class="card-box section hidden">
            <h3>Deck Progress</h3>
            <div class="stats-grid">
                <div class="stat-box to-learn">
                    <div>📚 To Learn</div>
                    <div class="stat-number" id="count-to-learn">0</div>
                </div>
                <div class="stat-box practiced">
                    <div>⏱️ Practiced</div>
                    <div class="stat-number" id="count-practiced">0</div>
                </div>
                <div class="stat-box learned">
                    <div>🎉 Learned</div>
                    <div class="stat-number" id="count-learned">0</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Supabase Configuration
    const SUPABASE_URL = "https://wmvyujfggczdyexrifkk.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_UR1kiYuEB-m2FeEFc-w5AQ_GU5rpo-a";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let decks = [];
    let activeDeckId = null;
    let currentCards = [];
    let currentCardIndex = -1;

    // Login logic
   async function login() {
    const usernameInput = document.getElementById('login-username').value.trim();
    const passwordInput = document.getElementById('login-password').value.trim();

    if (!usernameInput || !passwordInput) {
        alert("Please enter both username and password.");
        return;
    }

    try {
        const { data, error } = await supabase
            .from('app_users')
            .select('*')
            .eq('username', usernameInput)
            .eq('password', passwordInput)
            .maybeSingle();

        if (error) {
            alert('Supabase Connection Error: ' + error.message);
            return;
        }

        if (!data) {
            alert('Invalid username or password. Check for uppercase letters!');
            return;
        }

        currentUser = data;
        document.getElementById('user-display').textContent = currentUser.username;
        document.getElementById('view-login').classList.add('hidden');
        document.getElementById('view-app').classList.remove('hidden');

        await fetchDecks();
    } catch (e) {
        alert("Error logging in: " + e.message);
    }
}
    function logout() {
        currentUser = null;
        document.getElementById('view-app').classList.add('hidden');
        document.getElementById('view-login').classList.remove('hidden');
    }

    // Tab Navigation
    function showTab(tabName) {
        document.querySelectorAll('.section').forEach(el => el.classList.add('hidden'));
        document.querySelectorAll('.nav-tabs button').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`section-${tabName}`).classList.remove('hidden');
        document.getElementById(`tab-${tabName}`).classList.add('active');

        if (tabName === 'practice') loadNextCard();
        if (tabName === 'stats') updateStats();
    }

    // Deck Management
    async function fetchDecks() {
        const { data, error } = await supabase
            .from('decks')
            .select('*')
            .eq('user_id', currentUser.id);

        if (error) return alert(error.message);

        decks = data;
        const selector = document.getElementById('deckSelector');
        selector.innerHTML = '';

        if (decks.length === 0) {
            await createDeck("General Words");
            return;
        }

        decks.forEach(d => {
            const opt = document.createElement('option');
            opt.value = d.id;
            opt.textContent = d.name;
            selector.appendChild(opt);
        });

        activeDeckId = decks[0].id;
        await fetchCards();
    }

    async function createDeck(deckName) {
        const { data, error } = await supabase
            .from('decks')
            .insert([{ name: deckName, user_id: currentUser.id }])
            .select()
            .single();

        if (error) return alert(error.message);

        await fetchDecks();
    }

    async function createNewDeck() {
        const name = prompt("Enter new deck name:");
        if (name) await createDeck(name);
    }

    async function switchDeck() {
        activeDeckId = document.getElementById('deckSelector').value;
        await fetchCards();
    }

    // Card CRUD
    async function fetchCards() {
        if (!activeDeckId) return;
        
        const { data, error } = await supabase
            .from('cards')
            .select('*')
            .eq('deck_id', activeDeckId)
            .eq('user_id', currentUser.id);

        if (error) return alert(error.message);

        currentCards = data;
        loadNextCard();
        updateStats();
    }

    async function addCard() {
        const de = document.getElementById('input-de').value;
        const en = document.getElementById('input-en').value;
        const ex_de = document.getElementById('input-ex-de').value;
        const ex_en = document.getElementById('input-ex-en').value;

        if (!de || !en) return alert("German and English words are required.");

        const { error } = await supabase
            .from('cards')
            .insert([{
                user_id: currentUser.id,
                deck_id: activeDeckId,
                de, en, ex_de, ex_en, stage: 0
            }]);

        if (error) return alert(error.message);

        document.getElementById('input-de').value = '';
        document.getElementById('input-en').value = '';
        document.getElementById('input-ex-de').value = '';
        document.getElementById('input-ex-en').value = '';

        alert("Card saved!");
        await fetchCards();
    }

    // Auto-translation mock
    function autoTranslate() {
        const de = document.getElementById('input-de').value.trim();
        const en = document.getElementById('input-en').value.trim();

        if (de && !en) {
            document.getElementById('input-en').value = `[Trans] ${de}`;
            document.getElementById('input-ex-de').value = `Das ist ein Beispiel mit "${de}".`;
            document.getElementById('input-ex-en').value = `This is an example with "${de}".`;
        } else if (en && !de) {
            document.getElementById('input-de').value = `[Trans] ${en}`;
            document.getElementById('input-ex-de').value = `Das ist ein Beispiel mit "${en}".`;
            document.getElementById('input-ex-en').value = `This is an example with "${en}".`;
        }
    }

    // Learning Game Mechanics
    function loadNextCard() {
        const cardEl = document.getElementById('card');
        cardEl.classList.remove('flipped');

        if (currentCards.length === 0) {
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('empty-state').classList.remove('hidden');
            return;
        }

        document.getElementById('game-container').classList.remove('hidden');
        document.getElementById('empty-state').classList.add('hidden');

        currentCardIndex = Math.floor(Math.random() * currentCards.length);
        const card = currentCards[currentCardIndex];

        const showGermanFront = Math.random() > 0.5;

        if (showGermanFront) {
            document.getElementById('front-text').textContent = card.de;
            document.getElementById('front-subtext').textContent = "German (Click to flip)";
            document.getElementById('back-text').textContent = card.en;
            document.getElementById('back-example').textContent = card.ex_de ? `"${card.ex_de}"` : '';
        } else {
            document.getElementById('front-text').textContent = card.en;
            document.getElementById('front-subtext').textContent = "English (Click to flip)";
            document.getElementById('back-text').textContent = card.de;
            document.getElementById('back-example').textContent = card.ex_en ? `"${card.ex_en}"` : '';
        }
    }

    function flipCard() {
        document.getElementById('card').classList.toggle('flipped');
    }

    async function rateCard(success) {
        if (currentCardIndex === -1) return;
        const card = currentCards[currentCardIndex];
        let newStage = success ? Math.min(card.stage + 1, 4) : Math.max(card.stage - 1, 0);

        card.stage = newStage;

        await supabase
            .from('cards')
            .update({ stage: newStage })
            .eq('id', card.id);

        loadNextCard();
        updateStats();
    }

    function updateStats() {
        let toLearn = 0, practiced = 0, learned = 0;

        currentCards.forEach(c => {
            if (c.stage === 0) toLearn++;
            else if (c.stage >= 1 && c.stage < 4) practiced++;
            else if (c.stage >= 4) learned++;
        });

        document.getElementById('count-to-learn').textContent = toLearn;
        document.getElementById('count-practiced').textContent = practiced;
        document.getElementById('count-learned').textContent = learned;
    }
</script>
</body>
</html>
