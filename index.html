<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Card - DuoCards Demo</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #f4f7f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card-container {
      background: #ffffff;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    .back-btn {
      background: #e5e9f0;
      border: none;
      color: #4c566a;
      padding: 6px 14px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 16px;
    }
    h2 {
      margin: 0 0 20px 0;
      color: #2e3440;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #7b88a1;
      margin-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8dee9;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus {
      border-color: #3b82f6;
    }
    .btn-translate {
      width: 100%;
      background-color: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      margin: 8px 0 20px 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      transition: background-color 0.2s;
    }
    .btn-translate:hover {
      background-color: #2563eb;
    }
    .btn-save {
      width: 100%;
      background-color: #00a8ff;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: background-color 0.2s;
    }
    .btn-save:hover {
      background-color: #0090e0;
    }
  </style>
</head>
<body>

  <div class="card-container">
    <button class="back-btn" onclick="history.back()">← Back</button>
    <h2>Add Card</h2>

    <form id="cardForm" onsubmit="handleSave(event)">
      <div class="form-group">
        <label for="de">German Word/Phrase:</label>
        <input type="text" id="de" placeholder="e.g. das Handy" required>
      </div>

      <div class="form-group">
        <label for="en">English Translation:</label>
        <input type="text" id="en" placeholder="e.g. Mobile" required>
      </div>

      <button type="button" class="btn-translate" onclick="handleAutoTranslate()">
        ⚡ Auto-Translate
      </button>

      <div class="form-group">
        <label for="ex_de">Example Sentence (German):</label>
        <input type="text" id="ex_de" placeholder="e.g. Ich habe mein Handy vergessen.">
      </div>

      <button type="submit" class="btn-save">Save Card</button>
    </form>
  </div>

  <script>
    // Contextual German Example Generator
    function generateGermanExample(word, translation) {
      const clean = word.trim();
      const lower = clean.toLowerCase();

      if (!clean) return "";

      // 1. Nouns (with articles: der, die, das)
      if (/^(der|die|das)\s+/i.test(clean)) {
        return `Ich benutze ${clean} jeden Tag.`;
      }

      // 2. Verbs (ending in -en or -n)
      if (lower.endsWith('en') || lower.endsWith('n')) {
        return `Wir müssen heute ${lower}.`;
      }

      // 3. Adjectives / Adverbs
      const adjectives = ["gut", "schnell", "schön", "alt", "neu", "groß", "klein", "einfach", "schwer"];
      if (adjectives.includes(lower)) {
        return `Das ist wirklich sehr ${lower}.`;
      }

      // 4. Prepositions / Connectors / General
      return `Das Wort "${clean}" ist im Satz wichtig.`;
    }

    // Auto-Translate Action Handler
    async function handleAutoTranslate() {
      const deInput = document.getElementById('de');
      const enInput = document.getElementById('en');
      const exDeInput = document.getElementById('ex_de');

      const germanText = deInput.value.trim();
      if (!germanText) {
        alert("Please enter a German word first.");
        return;
      }

      try {
        // Free Client-Side Translation API (MyMemory API)
        const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(germanText)}&langpair=de|en`);
        const data = await response.json();

        if (data && data.responseData) {
          const translatedText = data.responseData.translatedText;
          enInput.value = translatedText;

          // Generate relevant German-only example
          exDeInput.value = generateGermanExample(germanText, translatedText);
        }
      } catch (err) {
        console.error("Translation error:", err);
        // Fallback sentence generator if API fails offline
        exDeInput.value = generateGermanExample(germanText, enInput.value);
      }
    }

    function handleSave(event) {
      event.preventDefault();
      const cardData = {
        de: document.getElementById('de').value,
        en: document.getElementById('en').value,
        ex_de: document.getElementById('ex_de').value,
        stage: 0
      };
      console.log("Card Saved:", cardData);
      alert("Card saved successfully!");
    }
  </script>
</body>
</html>
